<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Inicio de sesión del sistema de gestión de bodegas LogiTrack"
    >

    <title>Iniciar sesión | LogiTrack</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-page">

    <main class="login-wrapper">

        <section class="login-container" aria-labelledby="login-title">

            <header class="login-header">
                <div class="login-logo" aria-hidden="true">
                    LT
                </div>

                <h1 id="login-title">LogiTrack</h1>

                <p class="login-subtitle">
                    Sistema de gestión de bodegas e inventario
                </p>
            </header>

            <form id="loginForm" class="login-form" novalidate>

                <div class="form-group">
                    <label for="username">
                        Nombre de usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Ingrese su usuario"
                        autocomplete="username"
                        minlength="3"
                        maxlength="50"
                        required
                        autofocus
                        aria-describedby="usernameError"
                    >

                    <small
                        id="usernameError"
                        class="field-error"
                        aria-live="polite"
                    ></small>
                </div>

                <div class="form-group">
                    <label for="password">
                        Contraseña
                    </label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingrese su contraseña"
                            autocomplete="current-password"
                            minlength="6"
                            maxlength="100"
                            required
                            aria-describedby="passwordError"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>
                    </div>

                    <small
                        id="passwordError"
                        class="field-error"
                        aria-live="polite"
                    ></small>
                </div>

                <div
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="assertive"
                    hidden
                ></div>

                <button
                    type="submit"
                    id="loginButton"
                    class="primary-button"
                >
                    <span id="loginButtonText">
                        Iniciar sesión
                    </span>

                    <span
                        id="loginLoading"
                        class="loading-indicator"
                        aria-hidden="true"
                        hidden
                    >
                        Procesando...
                    </span>
                </button>

            </form>

            <footer class="login-footer">
                <p>
                    Acceso autorizado para administradores y empleados.
                </p>

                <a href="index.html">
                    Volver al inicio
                </a>
            </footer>

        </section>

    </main>

    <noscript>
        <div class="noscript-message">
            JavaScript debe estar habilitado para iniciar sesión en LogiTrack.
        </div>
    </noscript>

    <script src="js/auth.js" defer></script>
</body>
</html>
